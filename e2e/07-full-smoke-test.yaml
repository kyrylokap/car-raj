appId: com.kyrylokap.autoraj
---
- launchApp:
    clearState: true

- startRecording: full-smoke-test

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- assertVisible:
    id: "guest-login-button"
- tapOn:
    id: "guest-login-button"

- extendedWaitUntil:
    visible:
      id: "search-car-list"
    timeout: 20000

- assertVisible:
    id: "filter-button"

- tapOn:
    id: "filter-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-content"
    timeout: 10000
- assertVisible:
    id: "sheet-title"
- tapOn: "Reset"
- tapOn: "Show Results"

- assertVisible:
    id: "filter-button"

- assertVisible:
    id: "car-item-0"

- tapOn:
    id: "car-item-0"

- assertVisible:
    text: "Specifications"

- tapOn:
    id: "car-detail-favorite-button"

- tapOn:
    id: "car-detail-back-button"

- assertVisible:
    id: "search-car-list"

- tapOn: "Chats"
- assertVisible:
    id: "chats-screen"

- tapOn: "Profile"
- assertVisible:
    id: "profile-screen"

- tapOn: "My vehicles"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-content"
    timeout: 10000
- assertVisible:
    id: "sheet-title"
- swipe:
    direction: down

- assertVisible:
    id: "profile-screen"

- tapOn: "Favorites"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-content"
    timeout: 10000
- assertVisible:
    id: "sheet-title"
- swipe:
    direction: down

- assertVisible:
    id: "profile-screen"

- tapOn: "Settings"
- assertVisible:
    text: "Dark Mode"

- tapOn:
    id: "dark-mode-switch"

- tapOn:
    id: "settings-back-button"

- assertVisible:
    id: "profile-screen"

- tapOn: "Search"
- assertVisible:
    id: "search-car-list"

- stopRecording
